name: Build and Push colmena-app

# Consolidates what colmena-os ran as two separate, duplicate workflows
# (build-and-push.yml -> communityfirst/colmena-app,
#  build-unified.yml -> ${DOCKERHUB_USERNAME}/colmena-unified) building the
# *same* Dockerfile. Keeps the communityfirst/colmena-app name since it's
# already locked in downstream (colmena-casaos-appstore's Apps/Colmena/
# docker-compose.yml x-casaos block references it directly), with the
# Balena-draft dispatch step from build-unified.yml attached to it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types: [submodule-update]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

env:
  DOCKERHUB_USERNAME: communityfirst
  REGISTRY: docker.io
  IMAGE_NAME: colmena-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.build.outcome }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Colmena
            org.opencontainers.image.description=Colmena unified frontend + backend + nginx image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🐳 Docker Build Status: ✅ SUCCESS

            Unified Colmena app image built successfully.

            **Image:** \`communityfirst/colmena-app\`
            **Platforms:** ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
            **Commit:** \`${{ github.sha }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  trigger-balena-draft:
    needs: build-and-push
    if: needs.build-and-push.outputs.status == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Balena draft deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-to-balena-draft
          client-payload: |
            {
              "services": ["unified"],
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "trigger": "${{ github.event_name }}"
            }
